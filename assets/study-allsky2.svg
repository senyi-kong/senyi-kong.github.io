<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">First author · Forecast evaluation: study overview</title><desc id="desc">A hierarchy of experiments connects assimilation changes to forecast impacts. Conceptual schematic, no numerical results shown.</desc><rect width="960" height="320" fill="#f5f7f8"/><g font-family="Arial, sans-serif"><rect x="18" y="106" width="284" height="102" rx="4" fill="white" stroke="#c6d2da"/><text x="36" y="86" font-size="14" letter-spacing="1.5" fill="#576e7e">INPUT</text><text x="160" y="145" text-anchor="middle" font-size="19" fill="#203f56">All-sky assimilation</text><text x="160" y="177" text-anchor="middle" font-size="15" fill="#596b78">GIIRS in CMA-GFS</text><path d="M309 157h18m-6-5 6 5-6 5" fill="none" stroke="#536f83" stroke-width="1.7"/><rect x="338" y="106" width="284" height="102" rx="4" fill="#e6edf2" stroke="#c6d2da"/><text x="356" y="86" font-size="14" letter-spacing="1.5" fill="#576e7e">METHOD</text><text x="480" y="145" text-anchor="middle" font-size="19" fill="#203f56">Controlled experiments</text><text x="480" y="177" text-anchor="middle" font-size="15" fill="#596b78">Single-point, typhoon &amp; cycling</text><path d="M629 157h18m-6-5 6 5-6 5" fill="none" stroke="#536f83" stroke-width="1.7"/><rect x="658" y="106" width="284" height="102" rx="4" fill="white" stroke="#c6d2da"/><text x="676" y="86" font-size="14" letter-spacing="1.5" fill="#576e7e">OUTPUT</text><text x="800" y="145" text-anchor="middle" font-size="19" fill="#203f56">Forecast assessment</text><text x="800" y="177" text-anchor="middle" font-size="15" fill="#596b78">Humidity &amp; medium-range skill</text><text x="18" y="264" font-size="13" fill="#596b78">STUDY OVERVIEW</text><text x="942" y="264" text-anchor="end" font-size="13" fill="#596b78">2026</text></g></svg>
